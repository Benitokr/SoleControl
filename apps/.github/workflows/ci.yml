name: SoleControl CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build --workspace=@solecontrol/api
      - run: npm run build --workspace=@solecontrol/web
      - run: npx vitest run src/unit-formats.test.ts
        working-directory: apps/api
