services:
  postgres:
    image: postgres:16-alpine
    container_name: solecontrol-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solecontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solecontrol_secret}
      POSTGRES_DB: ${POSTGRES_DB:-solecontrol_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solecontrol} -d ${POSTGRES_DB:-solecontrol_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

